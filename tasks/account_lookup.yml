---
- name: Search for existing account
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts?filter=safeName%20eq%20{{ cyberark_account_safe | urlencode }}&search={{ cyberark_account_username | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_account_search
  run_once: true
  delegate_to: localhost

# search is free-text and may return false positives — match client-side on exact userName + address.
- name: Extract account ID from search results
  set_fact:
    _cyberark_account_current: >-
      {{
        _cyberark_account_search.json.value
        | selectattr('userName', 'equalto', cyberark_account_username)
        | selectattr('address', 'equalto', cyberark_account_address)
        | list | first | default({})
      }}
    cyberark_account_exists: >-
      {{
        _cyberark_account_search.json.value
        | selectattr('userName', 'equalto', cyberark_account_username)
        | selectattr('address', 'equalto', cyberark_account_address)
        | list | length > 0
      }}
  run_once: true
  delegate_to: localhost

- name: Set account ID from current state
  set_fact:
    cyberark_account_id: "{{ _cyberark_account_current.id | default('') }}"
  run_once: true
  delegate_to: localhost
