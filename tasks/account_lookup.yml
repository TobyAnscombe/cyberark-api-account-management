---
- name: Search for existing account
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts?filter=safeName%20eq%20{{
      cyberark_account_safe | urlencode }}&search={{ cyberark_account_username | urlencode }}"
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_account_search
  no_log: "{{ cyberark_no_log }}"
  run_once: true
  delegate_to: localhost
  check_mode: false

# Account names are unique per safe, so match on 'name' first when it's set —
# this is the documented lookup key. Fall back to the userName(+address)
# client-side match (search is free-text and may return false positives) only
# when the caller hasn't supplied cyberark_account_name, since userName+address
# is not guaranteed unique (e.g. the same user/host onboarded under two
# platforms in the same safe).
# When cyberark_account_address is empty (e.g. Azure/Entra accounts stored without an address field),
# match on userName only. When set, guard with selectattr('address', 'defined') first to prevent
# AttributeError on accounts that have no address key in the API response.
- name: Extract account ID from search results
  set_fact:
    _cyberark_account_current: >-
      {%- set _by_name = _cyberark_account_search.json.value | selectattr('name', 'equalto', cyberark_account_name) | list -%}
      {%- set _by_username = (
          _cyberark_account_search.json.value
          | selectattr('userName', 'equalto', cyberark_account_username)
          | selectattr('address', 'defined')
          | selectattr('address', 'equalto', cyberark_account_address)
          if cyberark_account_address | length > 0
          else
          _cyberark_account_search.json.value
          | selectattr('userName', 'equalto', cyberark_account_username)
        ) | list -%}
      {{
        (_by_name if cyberark_account_name | trim | length > 0 else _by_username)
        | first | default({})
      }}
    cyberark_account_exists: >-
      {%- set _by_name = _cyberark_account_search.json.value | selectattr('name', 'equalto', cyberark_account_name) | list -%}
      {%- set _by_username = (
          _cyberark_account_search.json.value
          | selectattr('userName', 'equalto', cyberark_account_username)
          | selectattr('address', 'defined')
          | selectattr('address', 'equalto', cyberark_account_address)
          if cyberark_account_address | length > 0
          else
          _cyberark_account_search.json.value
          | selectattr('userName', 'equalto', cyberark_account_username)
        ) | list -%}
      {{
        (_by_name if cyberark_account_name | trim | length > 0 else _by_username)
        | length > 0
      }}
  run_once: true
  delegate_to: localhost

- name: Set account ID from current state
  set_fact:
    cyberark_account_id: "{{ _cyberark_account_current.id | default('') }}"
  run_once: true
  delegate_to: localhost
