---
- name: "Look up desired reconcile account ID ({{ cyberark_account_reconcile_account_name }})"
  # No search= term: free-text search does not reliably match multi-word
  # display names (confirmed live — searching "HTB Domain Reconcile Account"
  # returned an unrelated account instead of the exact-name match). The
  # reconcile safe is small, so filter by safe only and match name client-side,
  # same precision-first approach as account_lookup.yml's name-match path.
  ansible.builtin.uri:
    url: >-
      https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts?filter={{
      ('safeName eq ' ~ cyberark_account_reconcile_safe) | urlencode }}
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_reconcile_lookup
  run_once: true
  delegate_to: localhost

- name: Extract desired reconcile account ID
  ansible.builtin.set_fact:
    _cyberark_reconcile_account_id: >-
      {{
        (_cyberark_reconcile_lookup.json.value
         | selectattr('name', 'equalto', cyberark_account_reconcile_account_name)
         | list | first | default({})).get('id', '')
      }}
  run_once: true
  delegate_to: localhost

- name: Fail if the reconcile account could not be resolved
  ansible.builtin.assert:
    that:
      - _cyberark_reconcile_account_id | length > 0
    fail_msg: >-
      Could not find reconcile account "{{ cyberark_account_reconcile_account_name }}" in safe
      "{{ cyberark_account_reconcile_safe }}" — check cyberark_account_reconcile_safe and
      cyberark_account_reconcile_account_name.
  run_once: true
  delegate_to: localhost

- name: "Get current linked accounts for {{ cyberark_account_name }}"
  ansible.builtin.uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/ExtendedAccounts/{{ cyberark_account_id }}/LinkedAccounts"
    method: GET
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    status_code: [200, 404]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_current_links
  run_once: true
  delegate_to: localhost

- name: Extract current reconcile-linked account ID (extraPasswordIndex 3)
  ansible.builtin.set_fact:
    _cyberark_current_reconcile_id: >-
      {{
        ((_cyberark_current_links.json | default({})).LinkedAccounts | default([])
         | selectattr('extraPasswordIndex', 'equalto', 3)
         | list | first | default({})).get('AccountId', '')
      }}
  run_once: true
  delegate_to: localhost

- name: Determine whether the reconcile link needs to change
  ansible.builtin.set_fact:
    _cyberark_reconcile_needs_link: "{{ _cyberark_current_reconcile_id != _cyberark_reconcile_account_id }}"
  run_once: true
  delegate_to: localhost

# Accumulated unconditionally (both dry-run and live) so the provision
# summary's change count is accurate during a dry-run preview, not just
# after a live apply — mirrors account_present.yml's "Accumulate account
# diff" task, which runs before the gated create/update tasks below it.
- name: Accumulate reconcile link in provision summary
  set_fact:
    _cyberark_provision_summary: >-
      {{
        _cyberark_provision_summary | default([]) + [{
          'safe': cyberark_account_safe, 'type': 'account', 'item': cyberark_account_name,
          'action': 'link-reconcile',
          'detail': 'reconcile account -> ' ~ cyberark_account_reconcile_safe ~ '/' ~ cyberark_account_reconcile_account_name
        }]
      }}
  when:
    - _cyberark_reconcile_needs_link
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Would link reconcile account for {{ cyberark_account_name }}"
  ansible.builtin.debug:
    msg: >-
      POST /Accounts/{{ cyberark_account_id }}/LinkAccount — {{ cyberark_account_name }} would be linked to
      reconcile account "{{ cyberark_account_reconcile_account_name }}" in safe {{ cyberark_account_reconcile_safe }}
  when:
    - _cyberark_reconcile_needs_link
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Reconcile account already linked ({{ cyberark_account_name }})"
  ansible.builtin.debug:
    msg: "{{ cyberark_account_name }} already linked to the desired reconcile account — skipping"
  when:
    - not _cyberark_reconcile_needs_link
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Link reconcile account
  ansible.builtin.uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts/{{ cyberark_account_id }}/LinkAccount"
    method: POST
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body:
      safe: "{{ cyberark_account_reconcile_safe }}"
      extraPasswordIndex: "3"
      name: "{{ cyberark_account_reconcile_account_name }}"
      folder: root
    status_code: [200, 201]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_account_reconcile_link
  no_log: true
  when:
    - _cyberark_reconcile_needs_link
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost
