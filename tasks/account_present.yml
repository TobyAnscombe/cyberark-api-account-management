---
- name: Look up existing account
  include_tasks: account_lookup.yml

- name: "[DRY RUN] Would create account {{ cyberark_account_name }}"
  ansible.builtin.debug:
    msg: "POST /Accounts — {{ cyberark_account_name }} in {{ cyberark_account_safe }} does not exist and would be created"
  when:
    - not cyberark_account_exists
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Create account
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts"
    method: POST
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body: >-
      {{
        {
          'name': cyberark_account_name,
          'address': cyberark_account_address,
          'userName': cyberark_account_username,
          'platformId': cyberark_account_platform_id,
          'safeName': cyberark_account_safe,
          'secretType': cyberark_account_secret_type,
          'secret': cyberark_account_secret,
          'platformAccountProperties': cyberark_account_platform_properties,
          'secretManagement': {
            'automaticManagementEnabled': cyberark_account_automatic_management_enabled,
            'manualManagementReason': cyberark_account_manual_management_reason
          }
        } | combine(
          {'secret': cyberark_account_secret}
          if cyberark_account_secret | trim | length > 0
          else {}
        ) | combine(
          {'platformAccountProperties': cyberark_account_platform_properties}
          if cyberark_account_platform_properties
          else {}
        ) | combine(
          {'remoteMachinesAccess': {
            'remoteMachines': cyberark_account_remote_machines,
            'accessRestrictedToRemoteMachines': cyberark_account_access_restricted_to_remote_machines
          }}
          if cyberark_account_remote_machines | trim | length > 0
          else {}
        )
      }}
    status_code: [201]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  no_log: true
  register: _cyberark_account_create
  when:
    - not cyberark_account_exists
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Build account patch operations
  set_fact:
    _cyberark_account_patch_ops: >-
      {{
        (
          [{'op': 'replace', 'path': '/name', 'value': cyberark_account_name}]
          if (_cyberark_account_current.name | default('')) != cyberark_account_name
          else []
        ) + (
          [{'op': 'replace', 'path': '/address', 'value': cyberark_account_address}]
          if (_cyberark_account_current.address | default('')) != cyberark_account_address
          else []
        ) + (
          [{'op': 'replace', 'path': '/userName', 'value': cyberark_account_username}]
          if (_cyberark_account_current.userName | default('')) != cyberark_account_username
          else []
        ) + (
          [{'op': 'replace', 'path': '/platformId', 'value': cyberark_account_platform_id}]
          if (_cyberark_account_current.platformId | default('')) != cyberark_account_platform_id
          else []
        ) + (
          [{'op': 'replace', 'path': '/secretManagement/automaticManagementEnabled',
            'value': cyberark_account_automatic_management_enabled}]
          if ((_cyberark_account_current.secretManagement | default({})).automaticManagementEnabled | default(true) | bool)
             != (cyberark_account_automatic_management_enabled | bool)
          else []
        ) + (
          [{'op': 'replace', 'path': '/secretManagement/manualManagementReason',
            'value': cyberark_account_manual_management_reason}]
          if ((_cyberark_account_current.secretManagement | default({})).manualManagementReason | default(''))
             != cyberark_account_manual_management_reason
          else []
        ) + (
          [{'op': 'replace', 'path': '/remoteMachinesAccess/remoteMachines',
            'value': cyberark_account_remote_machines}]
          if (
            cyberark_account_remote_machines | trim | length > 0
            and ((_cyberark_account_current.remoteMachinesAccess | default({})).remoteMachines | default(''))
              != cyberark_account_remote_machines
          )
          else []
        ) + (
          [{'op': 'replace', 'path': '/remoteMachinesAccess/accessRestrictedToRemoteMachines',
            'value': cyberark_account_access_restricted_to_remote_machines}]
          if (
            cyberark_account_remote_machines | trim | length > 0
            and ((_cyberark_account_current.remoteMachinesAccess | default({})).accessRestrictedToRemoteMachines | default(false) | bool)
              != (cyberark_account_access_restricted_to_remote_machines | bool)
          )
          else []
        )
      }}
  when:
    - cyberark_account_exists
  run_once: true
  delegate_to: localhost

- name: Build account change detail
  set_fact:
    _cyberark_account_change_detail: >-
      {%- set cur = _cyberark_account_current -%}
      {%- set rma = cur.remoteMachinesAccess | default({}) -%}
      {%- set cm = {
        '/name':                                              cur.name | default('') | string,
        '/address':                                           cur.address | default('') | string,
        '/userName':                                          cur.userName | default('') | string,
        '/platformId':                                        cur.platformId | default('') | string,
        '/secretManagement/automaticManagementEnabled':       (cur.secretManagement | default({})).automaticManagementEnabled | default('') | string,
        '/secretManagement/manualManagementReason':           (cur.secretManagement | default({})).manualManagementReason | default('') | string,
        '/remoteMachinesAccess/remoteMachines':               rma.remoteMachines | default('') | string,
        '/remoteMachinesAccess/accessRestrictedToRemoteMachines': rma.accessRestrictedToRemoteMachines | default('') | string
      } -%}
      {%- set ns = namespace(parts=[]) -%}
      {%- for op in _cyberark_account_patch_ops -%}
        {%- set ns.parts = ns.parts + [op.path ~ ': "' ~ cm.get(op.path, '') ~ '" → "' ~ op.value | string ~ '"'] -%}
      {%- endfor -%}
      {{ ns.parts | join(' | ') }}
  when:
    - cyberark_account_exists
    - _cyberark_account_patch_ops | length > 0
  run_once: true
  delegate_to: localhost

- name: Accumulate account diff in provision summary
  set_fact:
    _cyberark_provision_summary: >-
      {{
        _cyberark_provision_summary | default([]) + (
          [{'safe': cyberark_account_safe, 'type': 'account', 'item': cyberark_account_name,
            'action': 'create', 'detail': ''}]
          if not cyberark_account_exists
          else (
            [{'safe': cyberark_account_safe, 'type': 'account', 'item': cyberark_account_name,
              'action': 'update',
              'detail': _cyberark_account_change_detail | default('')}]
            if _cyberark_account_patch_ops | length > 0
            else []
          )
        )
      }}
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Would update account {{ cyberark_account_name }}"
  ansible.builtin.debug:
    msg: >-
      PATCH /Accounts/{{ cyberark_account_id }} — {{ cyberark_account_name }} would change:
      {{ _cyberark_account_patch_ops | map(attribute='path') | join(', ') }}
  when:
    - cyberark_account_exists
    - _cyberark_account_patch_ops | length > 0
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: "[DRY RUN] Account is up to date — no changes needed ({{ cyberark_account_name }})"
  ansible.builtin.debug:
    msg: "{{ cyberark_account_name }} matches desired state — skipping PATCH"
  when:
    - cyberark_account_exists
    - _cyberark_account_patch_ops | length == 0
    - cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Pre-clear remoteMachines before update
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts/{{ cyberark_account_id }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body:
      - op: replace
        path: /remoteMachinesAccess/remoteMachines
        value: ""
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  when:
    - cyberark_account_exists
    - _cyberark_account_patch_ops | selectattr('path', 'equalto', '/remoteMachinesAccess/remoteMachines') | list | length > 0
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Update account
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts/{{ cyberark_account_id }}"
    method: PATCH
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body: "{{ _cyberark_account_patch_ops }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  register: _cyberark_account_update
  when:
    - cyberark_account_exists
    - _cyberark_account_patch_ops | length > 0
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Expose created account as fact
  set_fact:
    cyberark_account_id: "{{ _cyberark_account_create.json.id }}"
    cyberark_account_detail: "{{ _cyberark_account_create.json }}"
  when:
    - not cyberark_account_exists
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Expose updated account as fact
  set_fact:
    cyberark_account_detail: "{{ _cyberark_account_update.json }}"
  when:
    - cyberark_account_exists
    - _cyberark_account_patch_ops | length > 0
    - not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Link reconcile account
  include_tasks: account_reconcile.yml
  when:
    - cyberark_account_reconcile_safe | trim | length > 0
    - cyberark_account_reconcile_account_name | trim | length > 0

- name: Update account secret
  include_tasks: account_secret.yml
  when:
    - cyberark_account_secret | trim | length > 0
    - cyberark_account_secret_update or not cyberark_account_exists
