---
- name: "[DRY RUN] Would update secret for account {{ cyberark_account_id | default('(new)') }}"
  ansible.builtin.debug:
    msg: "POST /Accounts/{{ cyberark_account_id | default('(new)') }}/Password/Update — secret would be set"
  when: cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost

- name: Update account secret
  uri:
    url: "https://{{ cyberark_subdomain }}.privilegecloud.cyberark.cloud/passwordvault/api/Accounts/{{ cyberark_account_id }}/Password/Update"
    method: POST
    headers:
      Authorization: "Bearer {{ cyberark_token }}"
    body_format: json
    body:
      ChangeEntireGroup: false
      NewCredentials: "{{ cyberark_account_secret }}"
    status_code: [200]
    timeout: 30
    validate_certs: "{{ cyberark_validate_certs }}"
  no_log: "{{ cyberark_no_log }}"
  when: not cyberark_dry_run | default(true) | bool
  run_once: true
  delegate_to: localhost
