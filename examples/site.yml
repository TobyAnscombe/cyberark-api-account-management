---
# Example: authenticate to CyberArk and manage a single account.
#
# Run:
#   ansible-playbook examples/site.yml \
#     -e cyberark_identity_tenant=YOUR_TENANT_ID \
#     -e cyberark_subdomain=YOUR_SUBDOMAIN \
#     --vault-password-file ~/.vault_pass
#
# Vault-encrypt your secrets first:
#   ansible-vault encrypt_string 'my-client-id'     --name cyberark_client_id
#   ansible-vault encrypt_string 'my-client-secret' --name cyberark_client_secret
#
# requirements.yml (install before running):
#   roles:
#     - name: cyberark_auth
#       src: https://github.com/TobyAnscombe/cyberark-api-management
#       version: main
#     - name: cyberark_account_management
#       src: https://github.com/TobyAnscombe/cyberark-api-account-management
#       version: main

- name: Manage CyberArk account
  hosts: localhost
  gather_facts: false

  vars:
    cyberark_identity_tenant: "YOUR_TENANT_ID"
    cyberark_subdomain: "YOUR_SUBDOMAIN"
    # cyberark_client_id: !vault |
    #   $ANSIBLE_VAULT;1.1;AES256
    #   ...
    # cyberark_client_secret: !vault |
    #   $ANSIBLE_VAULT;1.1;AES256
    #   ...

    cyberark_account_safe: "my-application-safe"
    cyberark_account_platform_id: "WinDomain"
    cyberark_account_address: "corp.example.com"
    cyberark_account_username: "svc_myapp"
    cyberark_account_name: "corp.example.com-svc_myapp"
    cyberark_account_state: present

    # CPM management — enabled by default (CyberArk rotates the credential).
    # For SSH key accounts where Ansible owns rotation, disable CPM:
    # cyberark_account_automatic_management_enabled: false
    # cyberark_account_manual_management_reason: "SSH key rotation managed by Ansible"

    # To seed an initial credential on create only (default: false — no push on update):
    # cyberark_account_secret_type: password
    # cyberark_account_secret: !vault |
    #   $ANSIBLE_VAULT;1.1;AES256
    #   ...
    # cyberark_account_secret_update: false

  roles:
    - cyberark_auth
    - cyberark_account_management

  tasks:
    - name: Show account detail
      debug:
        var: cyberark_account_detail
