---
galaxy_info:
  author: TobyAnscombe
  namespace: tobyanscombe
  role_name: cyberark_account_management
  description: >-
    Idempotently creates, updates, or deletes a CyberArk Privilege Cloud account
    and manages its credentials via the REST API
  license: MIT
  min_ansible_version: "2.14"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Ubuntu
      versions: [bionic, focal, jammy, noble]
    - name: Debian
      versions: [bullseye, bookworm]

# cyberark_token must be present on the play before this role runs.
# Supply it via cyberark_api_authentication or by another means.
# tasks/main.yml asserts cyberark_token is defined and non-empty, so there is
# no hard Ansible Galaxy meta dependency on the auth role here.
